<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User</title>
</head>
<body>
    <form action="api/resource" method="post" enctype="multipart/form-data">
        <label for="path">Upload Resource:
            <input id="path" type="text" name="path"/>
        </label><br/>
        <label for="file">
            <input id="file" type="file" name="file">
        </label><br/>
        <button type="submit">Upload file</button><br/>
    </form>
</body>
</html>
